enable
configure terminal

hostname SW1
enable secret 
username admin privilege 15 secret 

vlan 30
 name Management
exit

interface Vlan30
 ip address 192.168.30.11 255.255.255.0
 no shutdown
exit

interface FastEthernet0/11
 desciption To R1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30
 switchport mode trunk
 no shutdown
exit

interface range FastEthernet0/10, FastEthernet0/12
 description Etherchannel
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
exit

interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30
 switchport mode trunk
 no shutdown
exit

interface FastEthernet0/2
 switchport mode access
 description Management PC port
 switchport access vlan 30
 no shutdown
exit

line console 0 
logging synchronous

line vty 0 4
 login local
 transport input telnet
exit

do write memory
end