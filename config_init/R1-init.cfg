enable
configure terminal

hostname R1
enable secret 
username admin privilege 15 secret 

interface Serial0/1/0
 ip address 10.0.0.1 255.255.255.252
 no shutdown
exit

ip route 192.168.30.0 255.255.255.0 10.0.0.2

ip host R2 10.0.0.2
ip host SW2 192.168.30.12
ip host SW1 192.168.30.11

line console 0 
logging synchronous

line vty 0 4
 login local
 transport input telnet
exit

do write memory
end