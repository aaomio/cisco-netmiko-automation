ip domain-name lab.local

ip host WLC 192.168.30.20
ip host SW2 192.168.30.12

vlan 10
 name USERS
exit

vlan 20
 name STAFF
exit

vlan 40
 name MEDIA
exit

vlan 50
 name VOIP
exit

vlan 99
 name NATIVE
exit

vlan 201
 name Wireless-Internal
exit

vlan 202
 name Wireless-Guest
exit

spanning-tree mode pvst
spanning-tree extend system-id
spanning-tree vlan 10,20,30,99,201 priority 24576

interface Port-channel1
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99,201,202
 switchport mode trunk
 no shutdown
exit

interface FastEthernet0/1
 description Cisco WLC
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 30,99,201,202
 switchport mode trunk
 spanning-tree portfast trunk
 no shutdown
exit

interface FastEthernet0/3
 switchport access vlan 30
 switchport mode access
 switchport port-security
 spanning-tree portfast
 spanning-tree bpduguard enable
 no shutdown
exit

interface FastEthernet0/5
 switchport access vlan 30
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/10
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99,201,202
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
exit

interface FastEthernet0/11
 description *** R1 Router-on-a-Stick ***
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99,201,202
 switchport mode trunk
 no shutdown
exit

interface FastEthernet0/12
 switchport trunk encapsulation dot1q
 switchport trunk native vlan 99
 switchport trunk allowed vlan 10,20,30,40,50,99,201,202
 switchport mode trunk
 channel-group 1 mode active
 no shutdown
exit

interface FastEthernet0/13
 switchport access vlan 201
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface FastEthernet0/15
 switchport access vlan 202
 switchport mode access
 spanning-tree portfast
 no shutdown
exit

interface Vlan1
 no ip address
exit

ip default-gateway 192.168.30.1
ip classless
ip http server

line vty 5 15
 login local
 transport input telnet
exit
